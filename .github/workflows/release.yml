# Release: pushing a tag v<AppVersion> (git tag v1.1 && git push origin v1.1) builds
# the setup (Installer\Build.ps1) and publishes the release to the public releases
# repository (samagior/DynALisp.release), with the setup and CHANGELOG.md as assets
# and the changelog section of the version as notes. Dyl-Info and the automatic
# updates read that release (*dyl:relrepo* in dynalisp.mnl).
#
# The source repository is private: publishing to the other repository needs the
# RELEASE_TOKEN secret, a fine-grained token of samagior with Contents: Read and write
# on DynALisp.release only. Run it by hand (Actions > Release > Run workflow) to
# publish a tag again, e.g. after the token was renewed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (v1.0)'
        required: true

permissions:
  contents: read

env:
  RELEASE_REPO: samagior/DynALisp.release
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag is the AppVersion of PackageContents.xml
        shell: pwsh
        run: |
          [xml]$pkg = Get-Content -Raw PackageContents.xml
          $version = $pkg.ApplicationPackage.AppVersion
          if ($env:TAG.TrimStart('v') -ne $version) { throw "Tag $env:TAG is not the AppVersion of PackageContents.xml ($version)." }

      - name: Check the release token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'The RELEASE_TOKEN secret is missing (see the top of release.yml).' }
          gh repo view $env:RELEASE_REPO --json name | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_TOKEN cannot read $env:RELEASE_REPO (expired, or no access to it)." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the setup
        shell: pwsh
        run: ./Installer/Build.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $exe = (Get-ChildItem Releases/DynALisp-Setup-*.exe).FullName
          gh release view $env:TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            # Published again: same tag, new files and notes.
            gh release upload $env:TAG $exe CHANGELOG.md --repo $env:RELEASE_REPO --clobber
            gh release edit $env:TAG --repo $env:RELEASE_REPO --notes-file Releases/build/notes.md
          } else {
            gh release create $env:TAG $exe CHANGELOG.md --repo $env:RELEASE_REPO --title "DynALisp $env:TAG" --notes-file Releases/build/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
